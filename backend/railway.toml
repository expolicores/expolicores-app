# /backend/railway.toml

$schema = "https://railway.com/railway.schema.json"

[build]
# Fuerza el builder “Railpack” (no Dockerfile).
builder = "RAILPACK"

# Compila Nest: instala deps y transpila a dist/
buildCommand = "npm ci && npm run build"

# Opcional: paths que al cambiar disparan build
watchPatterns = [
  "src/**",
  "prisma/**",
  "package.json",
  "tsconfig*.json"
]

[deploy]
# Ejecuta migraciones antes de arrancar
preDeployCommand = ["npx prisma migrate deploy"]

# Arranque del servicio (Nest compilado)
startCommand = "node dist/main.js"

# Healthcheck (ajústalo a tu endpoint)
healthcheckPath = "/health"
healthcheckTimeout = 300

# Política de reinicio (sugerido)
restartPolicyType = "ALWAYS"

# Escalado simple (opcional)
numReplicas = 1
