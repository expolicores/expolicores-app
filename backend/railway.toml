# backend/railway.toml

[build]
# Usa Nixpacks (builder por defecto de Railway), no Docker
builder = "NIXPACKS"
# Compila Nest a dist/
buildCommand = "npm ci && npm run build"

[deploy]
# Corre migraciones antes de iniciar
preDeployCommand = "npx prisma migrate deploy"
# Arranque del servicio (Nest compilado)
startCommand = "node dist/main.js"
