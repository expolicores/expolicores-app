# CRÍTICO: Este archivo debe estar en la RAÍZ de tu repositorio.
# Esto asegura que Railway lo lea primero y aplique las reglas antes de intentar un Dockerfile.

[build]
# Indica a Railway que use el sistema de build automático de Node.js (Nixpacks).
# Esto ignora el Dockerfile y nos da un build más estable.
builder = "NIXPACKS"

# CRÍTICO: Indica a Nixpacks que busque el 'package.json' y el código
# fuente dentro de la carpeta 'backend'.
rootDirectory = "backend"

# Define explícitamente el comando que Railway debe ejecutar para iniciar
# el servicio DESPUÉS de la compilación, asegurando que use tu script de producción.
[start]
cmd = "npm run start:prod"